name: Revert Client Consultant

# Manual only - you press "Run workflow" and pick the mode.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What to do"
        required: true
        default: "dry_run"
        type: choice
        options:
          - dry_run   # writes nothing, just builds the plan + CSV
          - test      # actually writes the first 10 deals
          - full      # writes everything
      reviewed:
        description: "I reviewed the dry-run CSV (required for full)"
        required: true
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"
      scope:
        description: "first_touch = undo ALL workflow damage (recommended). after_cutoff = only after the date below."
        required: true
        default: "first_touch"
        type: choice
        options:
          - first_touch
          - after_cutoff
      workflow_start_iso:
        description: "Only used if scope=after_cutoff. UTC. 07:00Z = 12pm PKT."
        required: false
        default: "2026-06-06T07:00:00Z"

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run revert agent
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          MODE: ${{ inputs.mode }}
          REVIEWED: ${{ inputs.reviewed }}
          SCOPE: ${{ inputs.scope }}
          WORKFLOW_START_ISO: ${{ inputs.workflow_start_iso }}
        run: node revert-client-consultant.js

      - name: Upload the plan (downloadable CSV)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revert-plan
          path: revert-plan.csv
